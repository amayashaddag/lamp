[project]
name = "lamp"
version = "0.1.0"
description = "Deep learning tools implemented in NumPy for educational purposes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "numpy>=2.5.4",
    "setuptools>=84.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
